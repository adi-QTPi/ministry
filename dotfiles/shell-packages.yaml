---
# Linux shell packages required by the dotfiles (zshrc aliases + integrations).
# Consumed by the ansible chezmoi role; listed in .chezmoiignore so chezmoi skips it.
apt_packages:
  - git
  - zsh
  - zoxide
  - direnv
  - neovim
  - alacritty
  - unzip
  - rsync
  - fzf
  - fd-find
  - ripgrep
  - duf
  - curl
  - kubectl

apt_repositories:
  - name: kubernetes
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /"
    key_url: "https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key"
    keyring: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"

install_scripts:
  - name: starship
    url: "https://starship.rs/install.sh"
    args: "-y"
