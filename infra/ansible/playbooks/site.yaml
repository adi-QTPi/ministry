---
- name: Load SSH key into memory (ssh-agent)
  hosts: localhost
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Add key directly to running SSH agent
      ansible.builtin.shell: |
        echo "{{ ssh_key_ansible }}" | ssh-add -
      no_log: true
      check_mode: false

- import_playbook: azure/state.yaml
  vars:
    fetch_terraform_state_secrets:
      - tf_key: "public_ip"
        vault_name: "vault_azure_edge_host"

- import_playbook: network/tailscale.yaml

- import_playbook: ingress/proxy.yaml
  vars:
    proxy_caddy_template_path: "{{ playbook_dir }}/../../templates/caddy/Caddyfile.j2"
    proxy_haproxy_template_path: "{{ playbook_dir }}/../../templates/haproxy/haproxy.cfg.j2"

- name: Purge SSH key from agent memory
  hosts: localhost
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Clear all keys from ssh-agent
      ansible.builtin.command: ssh-add -D
      check_mode: false