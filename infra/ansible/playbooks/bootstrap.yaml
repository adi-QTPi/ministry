---
# serves the purpose of what an ideal cloud-init script should do.
# this playbook is supposed to be run to prime the servers for further playbooks, which assume that there exists a user named ansible with certain previliges.
# ansible-playbook ./playbooks/bootstrap.yaml -u ubuntu -K # this command assumes that every server can be sshed on the user "ubuntu"
- name: Setup ansible user with the appropriate ssh key and passwordless sudo.
  hosts: "{{ bootstrap_target | default('all') }}"
  gather_facts: true
  become: true

  tasks:
    - name: Create user
      ansible.builtin.user:
        name: ansible
        groups:
          - sudo
        append: true
        shell: /bin/bash

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add ansible user to docker group
      ansible.builtin.user:
        name: ansible
        groups:
          - docker
        append: true

    - name: Authorized ssh key
      ansible.posix.authorized_key:
        user: ansible
        key: "{{ pub_ssh_key_ansible }}"

    - name: Passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Install and connect Tailscale
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
      vars:
        state: latest
        verbose: true
        tailscale_authkey: "{{ tailscale_oauth_key }}"
        tailscale_tags:
          - "server"
        tailscale_oauth_ephemeral: true
        tailscale_oauth_preauthorized: true
        tailscale_args: "--hostname={{ inventory_hostname }} --ssh"
