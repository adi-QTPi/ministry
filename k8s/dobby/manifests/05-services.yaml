apiVersion: v1
kind: Service
metadata:
  name: dobby-relay
  namespace: dobby
spec:
  type: ClusterIP
  selector:
    app: dobby-relay
  ports:
  - name: http
    port: 3005
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: dobby-previews
  namespace: dobby
spec:
  type: ClusterIP
  selector:
    app: dobby-workspace
  ports:
  - name: http
    port: 8080
    targetPort: previews
---
apiVersion: v1
kind: Service
metadata:
  name: dobby-dashboard
  namespace: dobby
spec:
  type: ClusterIP
  selector:
    app: dobby-dashboard
  ports:
  - name: http
    port: 3000
    targetPort: http
