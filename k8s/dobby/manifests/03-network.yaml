apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: dobby
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  namespace: dobby
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-web
  namespace: dobby
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - dobby-workspace
      - dobby-relay
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - __PUBLIC_EXCEPT_CIDRS__
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-auth-smtp
  namespace: dobby
spec:
  podSelector:
    matchLabels:
      app: dobby-workspace
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - __PUBLIC_EXCEPT_CIDRS__
    ports:
    - protocol: TCP
      port: 465
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-to-relay
  namespace: dobby
spec:
  podSelector:
    matchLabels:
      app: dobby-workspace
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: dobby-relay
    ports:
    - protocol: TCP
      port: 3005
  - to:
    - podSelector:
        matchLabels:
          app: dobby-dashboard
    ports:
    - protocol: TCP
      port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-ingress
  namespace: dobby
spec:
  podSelector:
    matchLabels:
      app: dobby-relay
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: dobby-workspace
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
    ports:
    - protocol: TCP
      port: 3005
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terminal-and-previews-ingress
  namespace: dobby
spec:
  podSelector:
    matchLabels:
      app: dobby-workspace
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-ingress
  namespace: dobby
spec:
  podSelector:
    matchLabels:
      app: dobby-dashboard
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: dobby-workspace
    ports:
    - protocol: TCP
      port: 3000
