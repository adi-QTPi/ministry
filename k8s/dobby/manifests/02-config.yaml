apiVersion: v1
kind: ConfigMap
metadata: {name: dobby-workspace, namespace: dobby}
data:
  HAPPIER_SERVER_URL: "https://dobby.${TAILNET_DNS}"
  HAPPIER_PUBLIC_SERVER_URL: "https://dobby.${TAILNET_DNS}"
  HAPPIER_LOCAL_SERVER_URL: "http://dobby-relay.dobby.svc:3005"
  HAPPIER_WEBAPP_URL: "https://dobby.${TAILNET_DNS}"
  DOBBY_PREVIEW_HOST: "dobby-previews.${TAILNET_DNS}"
  DOBBY_PREVIEW_URL: "https://dobby-previews.${TAILNET_DNS}"
  DOBBY_TERMINAL_URL: "https://dobby-terminal.${TAILNET_DNS}"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dobby-relay, namespace: dobby}
data:
  NODE_ENV: production
  PORT: "3005"
  HAPPIER_SERVER_HOST: "0.0.0.0"
  HAPPIER_SERVER_FLAVOR: light
  HAPPIER_DB_PROVIDER: sqlite
  HAPPIER_FILES_BACKEND: local
  HAPPIER_SERVER_LIGHT_DATA_DIR: /data
  HAPPIER_SOCKET_ADAPTER: memory
  HAPPIER_PUBLIC_SERVER_URL: "https://dobby.${TAILNET_DNS}"
  HAPPIER_WEBAPP_URL: "https://dobby.${TAILNET_DNS}"
  HAPPIER_API_RATE_LIMITS_ENABLED: "true"
  # Bootstrap a device-key account on your private tailnet, then change to false.
  AUTH_ANONYMOUS_SIGNUP_ENABLED: "true"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dobby-nginx, namespace: dobby}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/dobby-nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/dobby-nginx-body;
      proxy_temp_path /tmp/dobby-nginx-proxy;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8080;
        server_name _;
        resolver ${DNS_SERVER} valid=10s ipv6=off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        location = /healthz { access_log off; return 200 'ok'; }
        # Path mode is an explicit compatibility option, not a universal app proxy.
        location ~ "^/live/[3-5][0-9]{3}$" { return 308 $uri/$is_args$args; }
        location ~ "^/live/(?<preview_port>[3-5][0-9]{3})/" {
          # Same container as the app: a 127.0.0.1-only server is reachable here.
          proxy_pass http://127.0.0.1:$preview_port$request_uri;
        }
        location /live/ { return 404; }
        location / {
          set $dashboard dobby-dashboard.dobby.svc;
          proxy_pass http://$dashboard:3000;
        }
      }
    }
