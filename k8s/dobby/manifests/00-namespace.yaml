apiVersion: v1
kind: Namespace
metadata:
  name: dobby
  labels:
    # Sudo/setuid and package-install capabilities require baseline, not restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dobby
  namespace: dobby
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dobby-budget
  namespace: dobby
spec:
  hard:
    pods: "5"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "2"
    limits.memory: 6Gi
    requests.ephemeral-storage: 2Gi
    limits.ephemeral-storage: 4Gi
    persistentvolumeclaims: "4"
