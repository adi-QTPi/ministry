apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: dobby-bella
spec:
  statefulSet:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${NODE_NAME}
