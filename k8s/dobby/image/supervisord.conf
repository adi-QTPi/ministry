[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/dobby-supervisord.pid
childlogdir=/tmp
umask=0077

[unix_http_server]
file=/tmp/dobby-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/dobby-supervisor.sock

[include]
files=%(ENV_HOME)s/.config/dobby/previews/*.conf

[program:happier]
command=/usr/local/bin/dobby-happier-start
directory=/workspace
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:preview-gateway]
command=/usr/sbin/nginx -c /etc/dobby/nginx.conf -g "daemon off;"
directory=/workspace
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:preview-auth]
command=/usr/local/bin/dobby-pangolin run
directory=/opt/pangolin
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tailscale]
command=/usr/local/bin/dobby-tailscale-start
directory=/home/dobby
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:herdr]
command=/usr/local/bin/dobby-herdr-start
directory=/workspace
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=45
stopsignal=INT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
