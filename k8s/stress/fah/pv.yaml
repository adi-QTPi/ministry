apiVersion: v1
kind: PersistentVolume
metadata:
  name: fah-data-pv
  labels:
    app: foldingathome
spec:
  capacity:
    storage: 2Gi 
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bella-storage-class
  hostPath:
    path: /home/karma/services/fah/fah-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - bella
