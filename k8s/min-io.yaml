---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
  namespace: apps
  labels:
    app: minio
data:
  MINIO_CONSOLE_ADDRESS: ":9001"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: apps
  labels:
    app: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: "root"
  MINIO_ROOT_PASSWORD: "yes_its_root_duh"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: minio
  namespace: apps
  labels:
    app: minio
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: minio-credentials
            - configMapRef:
                name: minio-config
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: local-storage
              mountPath: /data
      volumes:
        - name: local-storage
          hostPath:
            path: /var/mnt/minio-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: apps
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - port: 80
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
  type: ClusterIP
