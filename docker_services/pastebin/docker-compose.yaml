services:
  microbin:
    image: danielszabo99/microbin:latest
    container_name: pastebin
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - MICROBIN_PUBLIC_PATH=https://paste.karma.run.place
      - MICROBIN_PUBLIC_VOLUMES=true
      - MICROBIN_EDITABLE=true
      - MICROBIN_HIDE_HEADER=false
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/app/microbin_data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M 