name: azure-terraform

on:
  push:
    branches: [prod, staging]
    paths:
      - "infra/terraform/azure/main/**"
  pull_request:
    branches: [prod, staging]
    paths:
      - "infra/terraform/azure/main/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - id: set-env
        run: |
          TARGET="${{ github.base_ref || github.ref_name }}"
          if [[ "$TARGET" == *"prod"* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

  tf-validate:
    runs-on: ubuntu-latest
    outputs:
      validation-output: ${{ steps.validate.outputs.stdout }}
      validation-success: ${{ steps.validate.outcome == 'success' }}
    defaults:
      run:
        working-directory: infra/terraform/azure/main
    steps:
      - uses: actions/checkout@v4
      - name: Run Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          age-private-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Terraform Validate
        id: validate
        continue-on-error: true
        run: |
          just validate > validate.txt 2>&1
          echo "stdout<<EOF" >> $GITHUB_OUTPUT
          cat validate.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Security Scan (tfsec)
        id: tfsec
        continue-on-error: true
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: false
      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Validation & Security Status
            **Validation:** ${{ steps.validate.outcome == 'success' && 'Passed' || 'Failed' }}
            **Security Scan:** ${{ steps.tfsec.outcome == 'success' && 'Passed' || 'Failed' }}}

            <details>
            <summary>Show Validation Logs</summary>

            ```
            ${{ needs.tf-validate.outputs.validation-output }}
            ```
            </details>
      - name: Fail Job if issues found
        if: steps.validate.outcome == 'failure' || steps.tfsec.outcome == 'failure'
        run: exit 1

  tf-plan:
    needs: [set-env, tf-validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/azure/main
    steps:
      - uses: actions/checkout@v4
      - name: Run Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          age-private-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Terraform Plan
        run: just plan ${{ needs.set-env.outputs.env }}
      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: infra/terraform/azure/main/tfplan-${{ needs.set-env.outputs.env }}
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.set-env.outputs.env }}
          path: infra/terraform/azure/main/tfplan-${{ needs.set-env.outputs.env }}

  tf-apply:
    needs: [set-env, tf-plan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/azure/main
    steps:
      - uses: actions/checkout@v4
      - name: Download Plan Artifact
        if: github.event_name != 'act'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.set-env.outputs.env }}
          path: infra/terraform/azure/main/
      - name: Run Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          age-private-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Terraform Apply
        run: just apply ${{ needs.set-env.outputs.env }} -auto-approve
      - name: Delete Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: tfplan-${{ needs.set-env.outputs.env }}
