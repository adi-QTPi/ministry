name: azure-terraform

on:
  push:
    branches: [prod, staging]
    paths:
      - "infra/terraform/azure/main/**"
  pull_request:
    branches: [prod, staging]
    paths:
      - "infra/terraform/azure/main/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - id: set-env
        run: |
          TARGET="${{ github.base_ref || github.ref_name }}"
          if [[ "$TARGET" == *"prod"* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

  tf-validate:
    runs-on: ubuntu-latest
    outputs:
      validation-output: ${{ steps.validate.outputs.stdout }}
      validation-success: ${{ steps.validate.outcome == 'success' }}
    defaults:
      run:
        working-directory: infra/terraform/azure/main
    steps:
      - uses: actions/checkout@v4
      - name: Run Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          age-private-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Terraform Validate
        id: validate
        continue-on-error: true
        run: |
          just validate
      - name: Post Validate Comment
        if: always() && github.event_name == 'pull_request'
        uses: GetTerminus/terraform-pr-commenter@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commenter_type: validate
          commenter_input: ${{ format('{0}{1}', steps.validate.outputs.stdout, steps.validate.outputs.stderr) }}
          commenter_exitcode: ${{ steps.validate.outputs.exitcode }}
      - name: Fail Job if issues found
        if: steps.validate.outcome == 'failure'
        run: exit 1

  tf-plan:
    needs: [set-env, tf-validate]
    runs-on: ubuntu-latest
    env:
      TF_WORKSPACE: ${{ needs.set-env.outputs.env }}
    defaults:
      run:
        working-directory: infra/terraform/azure/main
    steps:
      - uses: actions/checkout@v4
      - name: Run Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          age-private-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          just plan ${{ needs.set-env.outputs.env }}
      - name: Post Plan Comment
        if: always() && github.event_name == 'pull_request'
        uses: GetTerminus/terraform-pr-commenter@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commenter_type: plan
          commenter_input: ${{ format('{0}{1}', steps.plan.outputs.stdout, steps.plan.outputs.stderr) }}
          commenter_exitcode: ${{ steps.plan.outputs.exitcode }}
      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.set-env.outputs.env }}
          path: infra/terraform/azure/main/tfplan-${{ needs.set-env.outputs.env }}
      - name: Fail Job if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  tf-apply:
    needs: [set-env, tf-plan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TF_WORKSPACE: ${{ needs.set-env.outputs.env }}
    defaults:
      run:
        working-directory: infra/terraform/azure/main
    steps:
      - uses: actions/checkout@v4
      - name: Download Plan Artifact
        if: github.event_name != 'act'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.set-env.outputs.env }}
          path: infra/terraform/azure/main/
      - name: Run Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          age-private-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Terraform Apply
        run: just apply ${{ needs.set-env.outputs.env }} -auto-approve
      - name: Delete Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: tfplan-${{ needs.set-env.outputs.env }}
